<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>Caça Palavras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #f5c842;
            --gold-deep: #c9982a;
            --emerald: #10b981;
            --emerald-glow: rgba(16,185,129,0.4);
            --found: #10b981;
            --selected-color: #f5c842;
            --bg: #080d08;
            --surface: #101810;
            --surface2: #141f14;
            --border: rgba(245, 200, 66, 0.15);
            --text: #f0eed8;
            --text-dim: rgba(240,238,216,0.5);
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
        }

        /* ─── Animated background particles ─── */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: drift 20s ease-in-out infinite alternate;
        }
        body::before {
            width: 600px; height: 600px;
            background: rgba(16,185,129,0.07);
            top: -200px; left: -200px;
        }
        body::after {
            width: 500px; height: 500px;
            background: rgba(245,200,66,0.05);
            bottom: -200px; right: -200px;
            animation-delay: -10s;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.1); }
        }

        /* ─── Main Layout ─── */
        .game-root {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 1fr;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 28px;
            gap: 0;
            overflow-y: auto;
        }

        .sidebar-logo {
            max-width: 100%;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 28px;
            display: none;
        }

        .sidebar-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .game-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 0.9;
            background: linear-gradient(135deg, var(--text) 30%, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .sidebar-divider {
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--emerald), transparent);
            border-radius: 2px;
            margin: 20px 0 24px;
        }

        .find-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        /* Word list */
        .word-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .word-chip {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .word-chip::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--gold-deep);
            border-radius: 0 2px 2px 0;
        }

        .word-chip .chip-icon {
            width: 22px; height: 22px; flex-shrink: 0;
            color: var(--gold-deep);
            transition: all 0.35s;
        }

        .word-chip.found {
            color: var(--text-dim);
            border-color: rgba(16,185,129,0.2);
            background: rgba(16,185,129,0.05);
        }
        .word-chip.found::before { background: var(--found); }
        .word-chip.found .chip-icon { color: var(--found); }
        .word-chip.found .word-text {
            text-decoration: line-through;
            text-decoration-color: rgba(16,185,129,0.5);
            text-decoration-thickness: 2px;
        }

        /* Score badges */
        .score-row {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 24px;
        }
        .score-badge {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .score-badge .badge-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
            display: block;
            margin-bottom: 4px;
        }
        .score-badge .badge-val {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            font-family: 'Space Mono', monospace;
            margin-top: 20px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--gold); }
        .back-link svg { width: 14px; height: 14px; }

        /* ─── Board Area ─── */
        .board-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
        }

        .board-wrap {
            background: rgba(10,14,10,0.7);
            border: 1px solid rgba(245,200,66,0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow:
                0 0 0 1px rgba(245,200,66,0.05),
                0 20px 60px rgba(0,0,0,0.6),
                inset 0 0 40px rgba(16,185,129,0.03);
            backdrop-filter: blur(10px);
        }

        .word-grid {
            display: grid;
            gap: 4px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ─── Cells ─── */
        .caca-cell {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.55);
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.15s;
        }

        .caca-cell:hover {
            background: rgba(245,200,66,0.08);
            color: var(--text);
            border-color: rgba(245,200,66,0.2);
            transform: scale(1.08);
        }

        .caca-cell.selected {
            background: rgba(245,200,66,0.18);
            color: var(--gold);
            border-color: var(--gold);
            transform: scale(1.12);
            box-shadow: 0 0 0 2px rgba(245,200,66,0.3), 0 0 12px rgba(245,200,66,0.3);
            z-index: 5;
        }

        .caca-cell.found-cell {
            background: rgba(16,185,129,0.15);
            color: var(--found);
            border-color: rgba(16,185,129,0.4);
            box-shadow: 0 0 10px rgba(16,185,129,0.25);
            animation: cellPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cellPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* ─── Modal ─── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 200;
        }
        .modal-overlay.hidden { display: none; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 52px 56px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(245,200,66,0.1);
        }

        .modal-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--emerald));
            border-radius: 24px 24px 0 0;
        }

        .modal-trophy {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 0 15px rgba(245,200,66,0.5));
        }

        .modal-heading {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text) 30%, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .modal-sub {
            color: var(--text-dim);
            font-size: 1.05rem;
            margin-bottom: 36px;
        }

        .btn-again {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--gold-deep), var(--gold));
            color: #000;
            border: none;
            cursor: pointer;
            padding: 18px 48px;
            border-radius: 60px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            box-shadow: 0 6px 30px rgba(245,200,66,0.3);
        }
        .btn-again:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(245,200,66,0.4);
        }

        .btn-modal-close {
            position: absolute;
            top: 18px; right: 18px;
            background: rgba(255,255,255,0.07);
            border: none;
            color: var(--text-dim);
            width: 34px; height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .btn-modal-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    </style>
</head>
<body>

<div class="game-root">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar">
        <img id="game-logo" class="sidebar-logo" src="" alt="">

        <span class="sidebar-title">◆ Central de Games</span>
        <h1 class="game-title">CAÇA<br>PALA<br>VRAS</h1>

        <div class="sidebar-divider"></div>

        <p class="find-label">Palavras para encontrar</p>
        <ul class="word-list" id="word-list">
            <!-- Preenchido via JS -->
        </ul>

        <div class="score-row">
            <div class="score-badge">
                <span class="badge-label">Achadas</span>
                <span class="badge-val" id="count-found">0</span>
            </div>
            <div class="score-badge">
                <span class="badge-label">Total</span>
                <span class="badge-val" id="count-total">0</span>
            </div>
        </div>

        <a href="config-caca-palavras.html" class="back-link">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Configurações
        </a>
    </aside>

    <!-- ─── BOARD ─── -->
    <main class="board-area">
        <div class="board-wrap">
            <div class="word-grid" id="word-grid">
                <!-- Células geradas via JS -->
            </div>
        </div>
    </main>

</div>

<!-- ─── MODAL VITÓRIA ─── -->
<div id="modal-overlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-box">
        <button class="btn-modal-close" id="btn-modal-close">✕</button>
        <span class="modal-trophy">🏆</span>
        <h2 class="modal-heading">Incrível!</h2>
        <p class="modal-sub">Você encontrou todas as palavras.<br>Parabéns pela performance!</p>
        <button class="btn-again" id="btn-play-again">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
            Jogar Novamente
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="caca-game.js"></script>
</body>
</html>
